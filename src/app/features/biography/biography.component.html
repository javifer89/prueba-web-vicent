<section class="biography">
  <div class="container">
    <header class="page-header">
      <h1>{{ 'biography.titulo' | translate }}</h1>
    </header>

    <div class="biography-content">
      @if (loading) {
        <div class="biography-loading">
          <p>{{ 'common.loading' | translate }}</p>
        </div>
      } @else if (sections.length > 0) {
        <div class="biography-sections">
          @for (section of sections; track $index; let i = $index) {
            <div class="biography-section" [class.reverse]="i % 2 === 1" [class.section-0]="i === 0" [class.section-1]="i === 1" [class.section-2]="i === 2" [class.section-3]="i === 3" [class.section-4]="i === 4">
              <div class="section-text" [innerHTML]="renderMarkdown(section.text)"></div>
              @if (section.image) {
                <div class="section-image">
                  <img
                    [src]="section.image"
                    [alt]="section.imageAlt"
                    loading="lazy"
                    width="800"
                    height="600"
                  />
                </div>
              }
            </div>
          }
        </div>
      } @else {
        <div class="biography-empty">
          <p>{{ 'common.noData' | translate }}</p>
        </div>
      }
    </div>
  </div>
</section>
