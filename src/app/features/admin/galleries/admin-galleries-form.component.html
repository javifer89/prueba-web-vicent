<!-- Galleries Form Template -->
<div class="admin-form-container">

  <!-- Form Header -->
  <div class="form-header">
    <h1 *ngIf="mode === 'create'" [translate]="'admin.media.new'"></h1>
    <h1 *ngIf="mode === 'edit'" [translate]="'admin.media.edit'"></h1>
    <span class="form-subtitle" *ngIf="galleryId">{{ gallery?.title_ca || 'Galería' }}</span>
  </div>

  <!-- Error Message -->
  <div *ngIf="error" class="form-error" role="alert">
    <span>{{ error }}</span>
  </div>

  <!-- Form Content -->
  <form [formGroup]="form" (ngSubmit)="onSave()" class="admin-form">

    <!-- Title Sections (Multi-locale) -->
    <div class="form-section">
      <h2 *translate="admin.media.title"></h2>
      
      <div class="form-group">
        <label [translate]="'admin.media.title_ca'"></label>
        <input formControlName="title_ca" type="text" placeholder="Títol en català" />
      </div>

      <div class="form-group">
        <label [translate]="'admin.media.title_es'"></label>
        <input formControlName="title_es" type="text" placeholder="Título en español" />
      </div>

      <div class="form-group">
        <label [translate]="'admin.media.title_en'"></label>
        <input formControlName="title_en" type="text" placeholder="Title in English" />
      </div>
    </div>

    <!-- Description Sections (Multi-locale) -->
    <div class="form-section">
      <h2 *translate="admin.media.description"></h2>

      <div class="form-group">
        <label [translate]="'admin.media.description_ca'"></label>
        <textarea formControlName="description_ca" rows="3" placeholder="Descripció en català"></textarea>
      </div>

      <div class="form-group">
        <label [translate]="'admin.media.description_es'"></label>
        <textarea formControlName="description_es" rows="3" placeholder="Descripción en español"></textarea>
      </div>

      <div class="form-group">
        <label [translate]="'admin.media.description_en'"></label>
        <textarea formControlName="description_en" rows="3" placeholder="Description in English"></textarea>
      </div>
    </div>

    <!-- Alt Text Sections (Multi-locale) -->
    <div class="form-section">
      <h2 *translate="admin.media.alt"></h2>

      <div class="form-group">
        <label [translate]="'admin.media.alt_ca'"></label>
        <input formControlName="alt_ca" type="text" placeholder="Texto alternativo en català" />
      </div>

      <div class="form-group">
        <label [translate]="'admin.media.alt_es'"></label>
        <input formControlName="alt_es" type="text" placeholder="Texto alternativo en español" />
      </div>

      <div class="form-group">
        <label [translate]="'admin.media.alt_en'"></label>
        <input formControlName="alt_en" type="text" placeholder="Alt text in English" />
      </div>
    </div>

    <!-- Media Type -->
    <div class="form-section">
      <h2 *translate="admin.media.type"></h2>
      
      <div class="form-control-select">
        <select formControlName="type">
          <option *ngFor="let t of typeOptions" [value]="t.value">
            {{ t.label }}
          </option>
        </select>
      </div>
    </div>

    <!-- Category -->
    <div class="form-section">
      <h2 *translate="admin.media.category"></h2>
      
      <div class="form-control-select">
        <select formControlName="category">
          <option value="">-- {{ 'admin.media.select-category' | translate }} --</option>
          <option *ngFor="let cat of categories$ | async" [value]="cat.id">
            {{ cat.name_ca || cat.name_es || cat.name_en || cat.title }}
          </option>
        </select>
      </div>
    </div>

    <!-- Date -->
    <div class="form-section">
      <h2 *translate="admin.media.date"></h2>
      
      <div class="form-control-select">
        <input formControlName="date" type="date" />
      </div>
    </div>

    <!-- Submit & Cancel -->
    <div class="form-actions">
      <button type="button" (click)="onCancel()" class="btn-cancel">
        <span *translate="admin.media.cancel"></span>
      </button>
      <button type="submit" [disabled]="saving" class="btn-save">
        <span *ngIf="!saving">{{ 'admin.media.save' | translate }}</span>
        <span *ngIf="saving" class="spinner-small"></span>
      </button>
    </div>

  </form>
</div>
