<header class="main-header" role="banner" [class.scrolled]="isScrolled">
  <nav class="main-nav" [attr.aria-label]="'nav.main' | translate">
    <a routerLink="/" class="logo" [attr.aria-label]="'site.name' | translate">
      <svg class="logo-icon" viewBox="0 0 120 120" fill="none" aria-hidden="true">
        <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="2"/>
        <path d="M60 30v60M30 60h60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle cx="60" cy="60" r="20" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="logo-text">{{ 'site.name' | translate }}</span>
    </a>

    <button
      class="nav-toggle"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      [attr.aria-label]="isMenuOpen ? ('common.closeMenu' | translate) : ('common.openMenu' | translate)"
      type="button"
    >
      <span class="hamburger" [class.open]="isMenuOpen" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>

    <ul class="nav-list" [class.open]="isMenuOpen" role="menubar">
      <li *ngFor="let item of navItems" class="nav-item" role="none">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          class="nav-link"
          role="menuitem"
          (click)="closeMenu()"
        >
          {{ item.label | translate }}
        </a>
      </li>
      <li class="nav-item nav-item--lang" role="none">
        <div class="lang-selector">
          <button
            class="lang-trigger"
            (click)="toggleLang()"
            [attr.aria-expanded]="isLangOpen"
            [attr.aria-label]="'common.language' | translate"
            type="button"
          >
            <span>{{ currentLang.toUpperCase() }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <ul class="lang-dropdown" [class.open]="isLangOpen" role="menu" *ngIf="isLangOpen">
            <li *ngFor="let lang of availableLangs" role="none">
              <button
                class="lang-option"
                (click)="setLang(lang.code)"
                role="menuitem"
              >
                {{ lang.name }}
              </button>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>
</header>
