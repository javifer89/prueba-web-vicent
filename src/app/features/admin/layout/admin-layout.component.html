<aside class="admin-sidebar" [class.collapsed]="isSidebarCollapsed()" aria-label="Navegación de administración">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M12 2L2 7l10 5 10-5-10-5z" />
        <path d="M2 17l10 5 10-5" />
        <path d="M2 12l10 5 10-5" />
      </svg>
      <span class="brand-text" *ngIf="!isSidebarCollapsed()">Administración</span>
    </div>
    <button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-expanded]="!isSidebarCollapsed()" aria-label="Alternar menú">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 12h18M3 6h18M3 18h18" *ngIf="isSidebarCollapsed()" />
        <path d="M15 18l-6-6 6-6" *ngIf="!isSidebarCollapsed()" />
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav" aria-label="Menú principal">
    <ul class="nav-list">
      <li *ngFor="let item of navItems" class="nav-item">
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="nav-link"
          [class.active]="isActive(item.path)"
        >
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <ng-container [ngSwitch]="item.icon">
              <path *ngSwitchCase="'newspaper'" d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" /><path *ngSwitchCase="'newspaper'" d="M8 8h8" /><path *ngSwitchCase="'newspaper'" d="M8 12h8" /><path *ngSwitchCase="'newspaper'" d="M8 16h5" />
              <path *ngSwitchCase="'calendar'" d="M8 2v4M16 2v4M3 10h18M3 14h18M3 18h18" />
              <path *ngSwitchCase="'music'" d="M9 18V5l12-2v13" /><circle *ngSwitchCase="'music'" cx="6" cy="18" r="3" /><circle *ngSwitchCase="'music'" cx="18" cy="16" r="3" />
              <path *ngSwitchCase="'image'" d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" /><circle *ngSwitchCase="'image'" cx="12" cy="12" r="4" />
              <path *ngSwitchCase="'grid'" d="M3 9h18M3 15h18M9 3v18M15 3v18" />
              <path *ngSwitchCase="'user'" d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle *ngSwitchCase="'user'" cx="12" cy="7" r="4" />
              <path *ngSwitchCase="'tag'" d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" /><line *ngSwitchCase="'tag'" x1="7" y1="7" x2="7.01" y2="7.01" />
              <circle *ngSwitchCase="'settings'" cx="12" cy="12" r="3" /><path *ngSwitchCase="'settings'" d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </ng-container>
          </svg>
          <span class="nav-label" *ngIf="!isSidebarCollapsed()">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer" *ngIf="!isSidebarCollapsed()">
    <div class="user-info">
      <div class="user-avatar">{{ getUserInitials() }}</div>
      <div class="user-details">
        <span class="user-name">{{ getUserName() }}</span>
        <span class="user-role">Administrador</span>
      </div>
    </div>
    <button class="btn btn-secondary btn-sm logout-btn" (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <polyline points="16 17 21 12 16 7" />
        <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      <span>Cerrar sesión</span>
    </button>
  </div>
</aside>

<div class="admin-main" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <header class="admin-header">
    <button class="mobile-menu-btn" (click)="toggleSidebar()" aria-label="Abrir menú" *ngIf="isSidebarCollapsed()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 12h18M3 6h18M3 18h18" />
      </svg>
    </button>
    <div class="header-title">
      <h1 *ngIf="!isSidebarCollapsed()">Administración</h1>
    </div>
    <div class="header-actions" *ngIf="!isSidebarCollapsed()">
      <a routerLink="/" target="_blank" class="btn btn-secondary btn-sm" title="Ver web pública">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <line x1="2" y1="12" x2="22" y2="12" />
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
        <span>Ver web</span>
      </a>
    </div>
  </header>

  <main class="admin-content" role="main">
    <router-outlet />
  </main>
</div>

<div class="sidebar-overlay" [class.visible]="!isSidebarCollapsed()" (click)="toggleSidebar()" aria-hidden="true"></div>
