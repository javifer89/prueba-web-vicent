<footer class="main-footer" role="contentinfo">
  <div class="footer-content">
    <div class="footer-left">
      <p class="footer-copyright">
        &copy; {{ currentYear }}
        <svg class="footer-logo" viewBox="0 0 120 120" fill="none" aria-hidden="true">
          <circle cx="60" cy="60" r="58" stroke="currentColor" stroke-width="2"/>
          <path d="M60 30v60M30 60h60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="60" cy="60" r="20" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        {{ 'footer.copyright' | translate }}
      </p>
      <p class="footer-tagline">{{ 'footer.tagline' | translate }}</p>
    </div>

    <div class="footer-right">
      <nav class="footer-legal" [attr.aria-label]="'footer.legalNav' | translate">
        <a routerLink="/politica-privacidad" class="footer-legal__link">{{ 'footer.privacy' | translate }}</a>
        <span class="footer-legal__sep" aria-hidden="true">|</span>
        <a routerLink="/uso-cookies" class="footer-legal__link">{{ 'footer.cookies' | translate }}</a>
      </nav>
    </div>
  </div>
</footer>
